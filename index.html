<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F4F2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Scout</title>
    <script>
      // FandomScout.com and Source.fan open on NBA Fandom (/nba/). Scout stays
      // reachable on those domains: links that carry ?app=scout or ?city=, sign-in returns
      // (#access_token, ?code=, errors), and anyone who has already opened Scout
      // in this tab. Other hosts are untouched.
      (function () {
        try {
          if (["fandomscout.com", "source.fan"].indexOf(location.hostname.replace(/^www\./, "")) < 0) return;
          var toScout = /[?&](app=scout|city=|code=|error=)/.test(location.search) || /access_token|refresh_token|error_description/.test(location.hash);
          if (toScout) { sessionStorage.setItem("scout.app", "1"); return; }
          if (sessionStorage.getItem("scout.app") === "1") return;
          location.replace("/nba/");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
