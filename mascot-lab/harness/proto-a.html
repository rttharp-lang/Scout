    <style>
      :root { --page: #e9e9e7; --ink: #15181d; --muted: #6b717b; }

      #root canvas { display: block; }
      .meta { padding: 10px 14px; color: var(--muted); white-space: pre; }
      table { border-collapse: collapse; margin: 12px 14px; }
      td, th { padding: 3px 12px 3px 0; text-align: left; border-bottom: 1px solid #ccc; }
    </style>

    <div class="meta" id="meta"></div>
