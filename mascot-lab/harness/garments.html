<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Garment mockups · Mascot Lab harness</title>
    <style>
      :root {
        --ink: #14171c;
        --ink-2: #5b636f;
        --ink-3: #8c94a0;
        --line: #d9dde3;
        --page: #f4f5f7;
        --card: #ffffff;
        --bad: #d22b2b;
        --warn: #b7791f;
        --good: #2f855a;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --sans: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
        --display: "Big Shoulders Display", "Archivo", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--page); color: var(--ink); }
      body { font: 13px/1.4 var(--sans); width: max-content; min-width: 100%; }
      header.top {
        display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
        padding: 18px 24px 14px; border-bottom: 1px solid var(--line); background: var(--card);
      }
      header.top h1 { margin: 0; font: 900 28px/1 var(--display); text-transform: uppercase; letter-spacing: 0.01em; }
      .mono { font-family: var(--mono); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
      .muted { color: var(--ink-2); }
      #status { margin-left: auto; }
      #status.done { color: var(--good); }
      #status.bad { color: var(--bad); }
      #notes { padding: 10px 24px 0; color: var(--ink-2); }
      #notes p { margin: 2px 0; }
      main { padding: 18px 24px 40px; }
      .grid { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
      figure.card { margin: 0; background: var(--card); border-radius: 6px; box-shadow: 0 0 0 1px rgba(20, 23, 28, 0.08); overflow: hidden; }
      .frame { position: relative; }
      .frame canvas { display: block; }
      .frame .err {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        padding: 16px; text-align: center; color: var(--bad); font: 600 12px/1.4 var(--mono);
        background: repeating-linear-gradient(45deg, rgba(210, 43, 43, 0.05) 0 10px, transparent 10px 20px);
      }
      figcaption { display: flex; align-items: baseline; gap: 10px; padding: 9px 12px 10px; border-top: 1px solid var(--line); }
      figcaption strong { font: 800 17px/1 var(--display); text-transform: uppercase; letter-spacing: 0.01em; }
      figcaption .ms { margin-left: auto; color: var(--ink-3); }
      figcaption .ms.slow { color: var(--warn); }
      figcaption .ms.over { color: var(--bad); }
      .swatches { display: inline-flex; gap: 3px; vertical-align: middle; }
      .swatches i { width: 12px; height: 12px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.15) inset; display: inline-block; }
      .frame.checker { background: repeating-conic-gradient(#e6e8eb 0 25%, #f6f7f8 0 50%) 0 0 / 24px 24px; }
      .grid.matrix { display: grid; grid-template-columns: repeat(2, max-content); }
      body.bare header.top, body.bare #notes { display: none; }
      body.bare main { padding: 0; }
      table.perf { border-collapse: collapse; margin-top: 18px; font: 12px/1.5 var(--mono); }
      table.perf td, table.perf th { padding: 3px 12px 3px 0; text-align: left; border-bottom: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <header class="top">
      <h1>Garment mockups</h1>
      <span class="mono muted" id="query"></span>
      <span class="mono" id="status">Loading…</span>
    </header>
    <div id="notes" class="mono"></div>
    <main id="main"><div class="grid" id="grid"></div></main>
    <script type="module" src="./garments.js"></script>
  </body>
</html>
