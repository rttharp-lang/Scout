<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Studio direction · Mascot Lab harness</title>
    <!--
      Design showcase for the "Studio" direction (DESIGN.md): a mock landing hero with a
      real effect render of the sample bulldog and the current hoodie mockup, a looks rail,
      a 3-up lookbook, the studio inspector, the order form/roster/summary and the
      loading / empty / error states — all built from the shared tokens, components and
      pattern classes (ml-tile, ml-grid, ml-rail, ml-split, ml-panel, ml-table, ml-empty…).
        ?theme=light|dark          force a theme (default: follow the OS)
        ?team=northgate|ember|forest|lemon   swap the team palette
        ?hero=chrome&look=graffiti  effect ids for the hero art and the studio canvas
        ?step=0..4                 header progress state
      Sets window.__READY = true once fonts and every render are in.
    -->
    <style>
      /* showcase-only composition (prefix ds-). Everything else comes from the system. */
      .ds-hero { padding-top: clamp(40px, 2rem + 3vw, 96px); }
      .ds-hero__top {
        display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px);
        align-items: end; gap: var(--space-6) var(--space-7);
        margin-bottom: clamp(32px, 1rem + 3vw, 56px);
      }
      /* the hero line is sized so its longest line ("EVERY LOOK." ≈ 8.7em) fits beside the aside */
      .ds-hero .t-hero { font-size: clamp(2.5rem, calc((100vw - 2 * var(--gutter) - 448px) / 8.8), 7.25rem); }
      .ds-hero__titles { display: grid; gap: var(--space-5); min-width: 0; }
      .ds-hero__aside { display: grid; gap: var(--space-5); padding-bottom: 0.35em; }
      .ds-hero__aside .t-lead { font-size: var(--text-lg); }
      .ds-ctas { display: flex; flex-wrap: wrap; gap: var(--space-3); }
      .ds-hero__media { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--grid-gap); }
      .ds-hero__art { --tile-ratio: 7 / 6; --tile-pad: 9%; }
      .ds-hero__product { --tile-ratio: auto; --tile-pad: 5%; height: 100%; }
      .ds-cap {
        position: absolute; left: 16px; bottom: 16px; right: 16px; z-index: 1;
        display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-3);
        pointer-events: none;
      }
      .ds-cap__pill {
        display: inline-grid; gap: 1px; padding: 9px 16px 10px; border-radius: var(--radius-lg);
        background: color-mix(in srgb, var(--page) 74%, transparent);
        -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px);
        color: var(--ink); pointer-events: auto;
      }
      .ds-cap__pill strong { font-size: var(--text-sm); font-weight: 600; }
      .ds-cap__pill span { font-size: var(--text-xs); color: var(--ink-2); }
      .ds-cap--dark .ds-cap__pill { background: rgb(255 255 255 / 0.1); color: #fff; box-shadow: inset 0 0 0 0.5px rgb(255 255 255 / 0.14); }
      .ds-cap--dark .ds-cap__pill span { color: rgb(255 255 255 / 0.66); }

      .ds-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-6); }
      .ds-fact { display: grid; gap: var(--space-2); padding-top: var(--space-5); border-top: 1px solid var(--line); }
      .ds-fact span:last-child { color: var(--ink-2); font-size: var(--text-sm); }

      .ds-canvas { --tile-ratio: 1; --tile-pad: 12%; max-height: calc(100vh - var(--header-h) - 48px); width: 100%; }
      .ds-canvas__bar {
        position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 1;
        display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap;
      }
      .ds-canvas__bar .ml-seg { background: rgb(255 255 255 / 0.16); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
      .ds-canvas__bar .ml-seg__opt { color: rgb(255 255 255 / 0.82); }
      .ds-canvas__bar .ml-seg__opt[aria-checked="true"] { background: #fff; color: #0b0c0f; }
      .ds-canvas__tools { position: absolute; top: 12px; right: 12px; z-index: 1; display: flex; gap: var(--space-2); }
      .ds-backdrops { display: flex; gap: 6px; padding: 6px; border-radius: var(--radius-pill); background: rgb(255 255 255 / 0.16); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
      .ds-backdrops .ml-swatch__chip { --sw: 24px; }

      .ds-insp-head { display: grid; gap: var(--space-2); }
      .ds-insp-head__row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
      .ds-insp-foot { display: grid; gap: var(--space-2); padding-top: var(--space-5); border-top: 1px solid var(--line); }

      .ds-form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); margin-bottom: var(--space-6); }
      .ds-roster-tools { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-4); }
      .ds-player { display: flex; align-items: center; gap: var(--space-3); font-weight: 500; }
      .ds-player i { font-style: normal; width: 28px; color: var(--ink-3); font-variant-numeric: tabular-nums; font-weight: 400; }
      .ds-summary { display: grid; gap: var(--space-5); padding: var(--space-6); border-radius: var(--radius-xl); background: var(--tile); }
      .ds-summary__total { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); padding-top: var(--space-4); border-top: 1px solid var(--line-strong); }
      .ds-summary__total strong { font-size: var(--text-3xl); font-weight: 600; letter-spacing: var(--tracking-tight); font-variant-numeric: tabular-nums; }
      .ds-tier { display: grid; gap: var(--space-2); }
      .ds-tier__bar { height: 4px; border-radius: 4px; background: var(--tile-strong); overflow: hidden; }
      .ds-tier__bar i { display: block; height: 100%; width: 62%; background: var(--accent); border-radius: inherit; }
      .ds-tier__legend { display: flex; justify-content: space-between; font-size: var(--text-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; }

      .ds-states { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--grid-gap); align-items: stretch; }
      .ds-states > * { min-height: 320px; }
      .ds-loading { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); align-content: start; }
      .ds-loading .ml-card { gap: var(--space-2); }
      .ds-notices { display: grid; gap: var(--space-3); margin-top: var(--space-5); grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .ds-toast-demo { position: static !important; width: auto !important; }

      .ml-sticky-bar.ds-phonebar { display: none; }

      @media (max-width: 1024px) {
        .ds-hero__top { grid-template-columns: minmax(0, 1fr); align-items: start; }
        .ds-hero .t-hero { font-size: var(--display-lg); }
        .ds-hero__aside { max-width: 560px; }
        .ds-form { grid-template-columns: 1fr 1fr; }
        .ds-states { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 720px) {
        .ds-hero__media { grid-template-columns: minmax(0, 1fr); }
        .ds-hero__art { --tile-ratio: 1; --tile-pad: 8% 12% 22%; }
        .ds-hero__product { --tile-pad: 4% 4% 18%; }
        .ds-hero__product { --tile-ratio: 4 / 5; height: auto; }
        .ds-ctas .ml-btn { flex: 1 1 100%; }
        .ds-facts { grid-template-columns: minmax(0, 1fr); gap: var(--space-5); }
        .ds-form { grid-template-columns: minmax(0, 1fr); }
        .ds-states, .ds-notices { grid-template-columns: minmax(0, 1fr); }
        .ds-states > * { min-height: 0; }
        .ml-sticky-bar.ds-phonebar { display: flex; }
        .ds-hide-phone { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./design.js"></script>
  </body>
</html>
